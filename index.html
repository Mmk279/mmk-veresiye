<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMK Veresiye Takip Programı</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1a2e;
  --bg2: #112240;
  --bg3: #0a1628;
  --panel: #152a4a;
  --panel2: #1a3358;
  --border: #1e3a5f;
  --border2: #2a4f7a;
  --blue: #1565c0;
  --blue2: #1976d2;
  --blue-bright: #42a5f5;
  --accent: #2196f3;
  --red: #ef5350;
  --red2: #e53935;
  --green: #43a047;
  --green2: #66bb6a;
  --white: #e8f4ff;
  --text: #cfe2f3;
  --text-muted: #6a8aaa;
  --cell-red: #ff4444;
  --cell-blue: #42a5f5;
  --cell-black: #dce8f5;
  --header-bg: #1a2f4a;
  --row-hover: rgba(33,150,243,0.08);
  --row-selected: rgba(33,150,243,0.18);
  --input-bg: #0d1e33;
  --input-border: #1e3a5f;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Exo 2',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  font-size:15px;
}

/* ── TITLEBAR ── */
.titlebar {
  background:linear-gradient(90deg,#0a1628,#112240);
  border-bottom:2px solid var(--blue);
  padding:6px 16px;
  display:flex; align-items:center; gap:10px;
  user-select:none;
}
.titlebar-title { font-family:'Oswald',sans-serif; font-size:14px; font-weight:500; color:var(--white); letter-spacing:.5px; }

/* ── MENUBAR ── */
.menubar {
  background:#0d1e33;
  border-bottom:1px solid var(--border);
  padding:2px 8px;
  display:flex; gap:2px;
}
.menu-item { padding:4px 12px; font-size:12px; color:var(--text); cursor:pointer; border-radius:3px; transition:background .15s; }
.menu-item:hover { background:var(--panel); }

/* ── LAYOUT ── */
.app-body {
  display:grid;
  grid-template-columns:1fr 300px;
  height:calc(100vh - 58px);
  overflow:hidden;
}

/* ── LEFT ── */
.left-pane { display:flex; flex-direction:column; border-right:2px solid var(--border); overflow:hidden; }

/* ── TOOLBAR ── */
.toolbar {
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:8px 12px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.toolbar-label { font-family:'Oswald',sans-serif; font-size:13px; font-weight:600; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase; }
.tb-input {
  background:var(--input-bg); border:1px solid var(--input-border); border-radius:4px;
  padding:6px 12px; color:var(--white); font-family:'Exo 2',sans-serif;
  font-size:14px; font-weight:600; outline:none; transition:border-color .2s;
}
.tb-input:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(33,150,243,.2); }
.tb-input::placeholder { color:var(--text-muted); }
#txtCariKod { width:55px; text-align:center; }
#txtCariUnvan { width:180px; }
#txtAra { width:160px; }

.btn { padding:6px 16px; border:none; border-radius:4px; font-family:'Oswald',sans-serif; font-size:13px; font-weight:600; letter-spacing:.5px; cursor:pointer; transition:all .2s; text-transform:uppercase; }
.btn-danger { background:var(--red2); color:#fff; }
.btn-danger:hover { background:#c62828; }
.btn-secondary { background:var(--panel2); color:var(--text); border:1px solid var(--border2); }
.btn-secondary:hover { background:var(--border2); }

/* ── TABLE ── */
.table-wrap { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; }
.table-wrap::-webkit-scrollbar { width:8px; }
.table-wrap::-webkit-scrollbar-track { background:var(--bg3); }
.table-wrap::-webkit-scrollbar-thumb { background:var(--panel2); border-radius:4px; }
table.main-table { width:100%; border-collapse:collapse; table-layout:fixed; }
table.main-table thead { position:sticky; top:0; z-index:10; }
table.main-table thead th {
  background:var(--header-bg); border:1px solid var(--border);
  padding:9px 12px; text-align:left; font-family:'Oswald',sans-serif;
  font-size:14px; font-weight:600; color:var(--blue-bright); letter-spacing:.8px; text-transform:uppercase; user-select:none;
}
table.main-table tbody tr { border-bottom:1px solid rgba(30,58,95,.5); cursor:pointer; transition:background .1s; }
table.main-table tbody tr:hover { background:var(--row-hover); }
table.main-table tbody tr.selected { background:var(--row-selected); }
table.main-table tbody td { padding:9px 12px; border-right:1px solid rgba(30,58,95,.3); font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.col-arrow { width:22px; }
.col-kod { width:60px; }
.col-unvan { width:auto; }
.col-tutar { width:110px; text-align:right; font-family:'Roboto Mono',monospace; }
.color-red { color:var(--cell-red)!important; }
.color-blue { color:var(--cell-blue)!important; }
.color-black { color:var(--cell-black)!important; }
.row-arrow { color:var(--blue-bright); font-size:10px; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  background:var(--bg3); border-top:1px solid var(--border);
  padding:6px 12px; display:flex; align-items:center; gap:8px;
}

/* ── RIGHT PANE ── */
.right-pane {
  background:var(--bg2); display:flex; flex-direction:column;
  overflow-y:auto; padding:10px; gap:12px;
}
.right-pane::-webkit-scrollbar { width:6px; }
.right-pane::-webkit-scrollbar-thumb { background:var(--panel2); border-radius:3px; }

/* ── SAAT ── */
.saat-box { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:8px 14px; text-align:center; }
#lblCanliSaat { font-family:'Roboto Mono',monospace; font-size:20px; font-weight:700; color:var(--blue-bright); letter-spacing:2px; text-shadow:0 0 12px rgba(66,165,245,.5); }

/* ── TAKVİM ── */
.takvim-box { background:var(--bg3); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.takvim-header { background:var(--header-bg); padding:6px 10px; display:flex; align-items:center; justify-content:space-between; font-family:'Oswald',sans-serif; font-size:13px; font-weight:600; color:var(--blue-bright); }
.takvim-nav { background:none; border:1px solid var(--border2); color:var(--text); width:22px; height:22px; border-radius:3px; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; }
.takvim-nav:hover { background:var(--panel2); }
.takvim-grid { padding:6px; }
.takvim-days { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
.takvim-day-label { text-align:center; font-size:10px; font-weight:700; color:var(--text-muted); padding:2px 0; font-family:'Oswald',sans-serif; }
.takvim-cells { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.takvim-cell { text-align:center; padding:4px 2px; font-size:11px; border-radius:3px; cursor:pointer; color:var(--text); font-weight:600; transition:background .1s; }
.takvim-cell:hover { background:var(--panel2); }
.takvim-cell.today { background:var(--blue2); color:#fff; box-shadow:0 0 8px rgba(25,118,210,.5); }
.takvim-cell.other-month { color:var(--text-muted); }
.takvim-today-label { padding:4px 8px; font-size:10px; color:var(--text-muted); border-top:1px solid var(--border); text-align:center; font-family:'Roboto Mono',monospace; }

/* ── HIZLI İŞLEM ── */
.hizli-box { background:var(--bg3); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.hizli-header { background:var(--header-bg); padding:7px 12px; display:flex; align-items:center; justify-content:space-between

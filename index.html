<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMK Veresiye Takip Programı</title>
  <!-- Google Fonts ve Diğer Kütüphaneler -->
  <!-- ... aynı font linkleri ... -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Tüm Önceki CSS Kodların - Sadece aşağıdaki kısımları güncelle veya ekle: */

    /* --- YENİ BAKİYE GRAFİĞİ KUTUSU (Cari için) --- */
    .bakiye-chart-box { 
      background: var(--bg3); 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      padding: 20px; 
      text-align: center; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px; 
      margin-bottom: 12px;
    }
    /* --- MOBİL GÖRÜNÜM GÜÇLENDİRİLMİŞ --- */
    @media (max-width: 850px) {
      .app-body{ grid-template-columns:1fr!important; height:auto; flex-direction:column;}
      .right-pane, .detay-right-pane, .detay-modal, .left-pane, .table-wrap, .bakiye-chart-box, .bakiye-box {
        width: 100%!important; min-width: 0!important; max-width:100vw!important; border-radius:0!important; box-shadow:none!important;
      }
      .tab-bar {
        flex-direction:column;
        height:auto;
        padding:0;
      }
      .tab-btn { width:100%; text-align:left;}
      .modal-overlay .detay-modal,
      .modal-overlay .rapor-modal {
        width:99vw!important;height:95vh!important;min-width:0!important;
      }
      input, .btn, textarea { font-size:16px;}
    }
    @media (max-width:480px){
      .titlebar-market {font-size: 16px;}
      .titlebar {padding: 7px 4px;}
      .titlebar-logo {width: 30px; height: 30px;}
      .detay-titlebar, .detay-footer, .menubar, .toolbar {font-size:14px;}
      .bakiye-chart-box, .bakiye-box, .saat-box, .takvim-box, .hizli-box {padding:8px!important;}
      th,td {font-size:14px;}
    }

    /* ... mevcut tüm temalar ve görsel stiller devam ... */
  </style>
</head>
<body>
<!-- --- =========================== ZORUNLU ! ============================ --- -->
<!-- MODAL, OVERLAY, MENUBAR, TİTLE, TAKVİM, her şey KALACAK - değişiklik Sadece sağ panelin içinde: -->
<!-- ====================================================================== -->

<!-- ... (başlangıçta olan kodlar, login, modal, titlebar vs. değişmeyecek) ... -->

<div class="titlebar">
  <!-- ... logonuz ve başlık ... -->
</div>
<div class="menubar">
  <!-- ... menü butonları ... -->
</div>
<!-- SEKME BAR -->
<div class="tab-bar">
  <!-- ... sekmeler ... -->
</div>

<div class="app-body" id="cariPane">
  <!-- SOL: Cari liste -->
  <div class="left-pane">
    <!-- ... Cari Toolbar ... -->
    <div class="toolbar">
      <!-- ... cari ekle, ara butonları ... -->
    </div>
    <div class="table-wrap" id="tableWrap">
      <!-- ... müşteri listesi ... -->
    </div>
    <div class="bottom-bar">
      <!-- ... alttaki excel, rapor, yedekleme ... -->
    </div>
  </div>
  <!-- SAĞ: Yeni Borç Durumu Grafik Kutusu ve Toplam Alacak -->
  <div class="right-pane">
    <div class="saat-box"><div id="lblCanliSaat">--.--.---- | --:--:--</div></div>
    <div class="takvim-box"><!-- ...takvim çizim kutunuz... --></div>
    <!-- YENİ BAKİYE GRAFİĞİ (DONUT/KART) -->
    <div class="bakiye-chart-box">
      <div style="font-family:Oswald,sans-serif;font-size:14px;color:var(--blue-bright);font-weight:700;letter-spacing:1.2px;">Cari Durum</div>
      <svg id="cariDonutGraph" width="90" height="90" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="48" stroke="#182940" stroke-width="13" fill="none"/>
        <circle id="cariBorcluGraph" cx="60" cy="60" r="48" stroke="#ef5350" stroke-width="13" 
                stroke-dasharray="0" stroke-dashoffset="0" fill="none" stroke-linecap="round"
                transform="rotate(-90 60 60)"/>
      </svg>
      <div style="font-size:12px;color:var(--text-muted);">Borçlu %<span id="cariBorcluPct">0</span></div>
      <div style="display:flex;justify-content:center;gap:14px;">
        <div style="font-size:11px;color:var(--red)">Borçlu: <span id="borcluSay">0</span></div>
        <div style="font-size:11px;color:#66bb6a;">Temiz: <span id="temizSay">0</span></div>
        <div style="font-size:11px;color:var(--blue-bright)">Alacaklı: <span id="alacakliSay">0</span></div>
      </div>
    </div>
    <div class="bakiye-box">
      <div class="bakiye-label">Toplam Alacak</div>
      <div id="lblGenelBakiye">0,00</div>
    </div>
  </div>
</div>

<!-- ... detay overlay, modallar ... -->
<!-- ... alt tarafta scriptler ... -->

<script>
  // ... Tüm mevcut kodlarınız devam edecek ...
  // *** miniDashboardGuncelle FONKSİYONUNU KALDIRIN ***
  // *** YENİ GRAFİK GÜNCELLEME FONKSİYONU EKLEYİN: ***

  function cariDurumGraphGuncelle() {
    if (!cariListesi.length) return;
    const borclu = cariListesi.filter(c=>Number(c.bakiye)>0);
    const temiz = cariListesi.filter(c=>Number(c.bakiye)===0);
    const alacakli = cariListesi.filter(c=>Number(c.bakiye)<0);

    // Donut oranı
    const pct = Math.round((borclu.length / cariListesi.length)*100);
    document.getElementById('borcluSay').textContent = borclu.length;
    document.getElementById('temizSay').textContent = temiz.length;
    document.getElementById('alacakliSay').textContent = alacakli.length;
    document.getElementById('cariBorcluPct').textContent = pct;

    // Donut SVG ayarla
    const circle = document.getElementById('cariBorcluGraph');
    const r = 48;
    const C = 2 * Math.PI * r;
    circle.setAttribute('stroke-dasharray', `${C} ${C}`);
    circle.setAttribute('stroke-dashoffset', `${C*(1-pct/100)}`);
  }

  // TABLO YÜKLEME ve FİLTRELEME SONRASINDA GRAFİĞİ DE GÜNCELLE!
  // (Örnek: tabloYenile, carileritabloyaYukle, genelBakiyeHesapla sonuna ekle)
  function tabloYenile() {
    // ... var olan kodlar ...
    cariDurumGraphGuncelle();
  }
  async function carileritabloyaYukle() {
    // ... var olan kodlar ...
    tabloYenile();
    genelBakiyeHesapla();
    cariDurumGraphGuncelle();
  }
  function genelBakiyeHesapla() {
    // ... var olan kodlar ...
    cariDurumGraphGuncelle();
  }

  // ... geri kalan JS kodunuz olduğu gibi devam eder...

</script>
</body>
</html>
